spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.max-allowed-packet=40MB
spring.datasource.hikari.maximum-pool-size=5
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.encoding=UTF-8
error.receiving.mail_id=${ERROR_RECEIVING_MAIL}
error.sender.mail_id=${ERROR_SENDER_MAIL}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=6000MB
spring.jackson.parser.allow-unquoted-control-chars=true

# Async DASH thread pool (matches AsyncConfig.java bean)
# corePoolSize  = number of videos encoded simultaneously
# Tune to (CPU cores / 2) on your server
dash.executor.core-pool-size=2
dash.executor.max-pool-size=4
dash.executor.queue-capacity=10

jwt.secret=${JWT_SECRET}
project.video=${PROJECT_VIDEO}
project.vrvideo=${PROJECT_VR_VIDEO}
project.testvideo=${PROJECT_TEST_VIDEO}
project.testoutput=${PROJECT_TEST_OUTPUT}
project.videotrailer=${PROJECT_VIDEO_TRAILER}
project.uploads.advideos=${PROJECT_AD_VIDEOS}
file.upload-dir=${FILE_UPLOAD_DIR}
upload.licence.directory=${UPLOAD_LICENCE_DIR}
upload.audio.directory=${UPLOAD_AUDIO_DIR}
upload.Profile.directory=${UPLOAD_PROFILE_DIR}
upload.sqlport.directory=data/custom_input.txt
app.storage.private-dir=${APP_STORAGE_PRIVATE}
app.storage.public-dir=${APP_STORAGE_PUBLIC}
ffmpeg.path=${FFMPEG_PATH}
project.url=${PROJECT_URL}
rzp_currency=${RZP_CURRENCY}
rzp_company_name=${RZP_COMPANY_NAME}
logging.file.name=mediajungle.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
