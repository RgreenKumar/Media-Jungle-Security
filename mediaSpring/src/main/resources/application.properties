# ===================================================================================
# GDPR-TASK-20: GDPR / privacy configuration block. Kept environment-specific so that
# retention windows, contact details, and CORS origins can differ between dev/stage/prod
# without touching code (GDPR Art. 5(1)(e) storage limitation, Art. 13/14 transparency).
# ===================================================================================

# How long an abandoned/unconfirmed registration (consentGiven=false) is kept before the
# daily DataRetentionScheduler job anonymises it.
gdpr.retention.unconfirmed-account-days=30
# How long GDPR audit-log entries are kept before being purged.
gdpr.retention.audit-log-days=730

# Contact details surfaced on the Privacy Policy page / data-subject-rights emails.
gdpr.dpo.contact-email=${GDPR_DPO_EMAIL:privacy@mediajungle.example}
gdpr.controller.company-name=${GDPR_COMPANY_NAME:Media Jungle}

# Explicit CORS allow-list consumed by GlobalCorsConfig (GDPR-TASK-19). Comma-separated,
# no wildcard "*" - required whenever allow-credentials is enabled and personal data
# may be returned in responses.
gdpr.cors.allowed-origins=${GDPR_CORS_ORIGINS:http://localhost:3000,http://localhost:4203}

# GDPR-TASK-20 (cont.): force cookies issued by the servlet container (e.g. any session
# cookie, JSESSIONID) to be HttpOnly/Secure/SameSite=Lax so they cannot be read by
# client-side JS and are not sent over plain HTTP (GDPR Art. 32 security of processing).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax